name: Geo Videos - ZIP a APK

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      # No lanzar compilaciones por eliminar o reemplazar la copia del proyecto.
      - '!Geo-VIDEOS-actual.zip'
      - 'incoming/**/*.zip'
      - '.github/workflows/zip-to-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geo-videos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importar-y-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detectar ZIP nuevo
        id: zip
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          candidates = []
          if os.getenv('GITHUB_EVENT_NAME') == 'push':
              previous = os.getenv('PREVIOUS_SHA', '')
              current = os.environ['GITHUB_SHA']
              if previous and previous != '0' * 40:
                  changed = subprocess.check_output(
                      ['git', 'diff', '--name-only', '--diff-filter=ACMR', previous, current],
                      text=True,
                  ).splitlines()
              else:
                  changed = subprocess.check_output(
                      ['git', 'show', '--pretty=format:', '--name-only', current],
                      text=True,
                  ).splitlines()
              for name in changed:
                  path = Path(name)
                  if (path.is_file() and path.suffix.lower() == '.zip'
                          and path.name != 'Geo-VIDEOS-actual.zip'
                          and (len(path.parts) == 1 or path.parts[0] == 'incoming')):
                      candidates.append(path)

          if len(candidates) > 1:
              raise SystemExit('Sube un solo ZIP por actualizacion: ' + ', '.join(map(str, candidates)))

          file = candidates[0].as_posix() if candidates else ''
          # Mantener la version original para identificar y recuperar cada APK.
          import re
          version = re.sub(r'[^A-Za-z0-9._-]', '-', Path(file).stem) if file else ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'has_zip={"true" if file else "false"}\n')
              output.write(f'file={file}\n')
              output.write(f'version={version}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if file:
                  summary.write(f'## Archivo subido: `{Path(file).name}`\n\n')
              else:
                  summary.write('## Compilacion del codigo existente (sin ZIP nuevo)\n\n')
          print('Nuevo ZIP: ' + (file or 'ninguno; compilar codigo existente'))
          PY

      - name: Extraer e importar ZIP de forma segura
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          source_zip = Path(os.environ['ZIP_FILE'])
          temp = Path(os.environ['RUNNER_TEMP']) / 'geo-videos-entrada'
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir(parents=True)

          total = 0
          with zipfile.ZipFile(source_zip) as z:
              for item in z.infolist():
                  name = item.filename.replace('\\', '/')
                  parts = PurePosixPath(name)
                  if parts.is_absolute() or '..' in parts.parts or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f'Entrada insegura: {name}')
                  total += item.file_size
                  if total > 3 * 1024 ** 3:
                      raise SystemExit('ZIP demasiado grande (limite 3 GB)')
              z.extractall(temp)

          candidates = []
          for name in ('settings.gradle.kts', 'settings.gradle'):
              for settings in temp.rglob(name):
                  project = settings.parent
                  if (project / 'app').is_dir() and len(project.relative_to(temp).parts) <= 3:
                      candidates.append(project)
          if not candidates:
              raise SystemExit('El ZIP no contiene un proyecto Android (app + settings.gradle)')
          project = min(candidates, key=lambda p: (len(p.relative_to(temp).parts), str(p)))
          print('Proyecto importado desde: ' + str(project))
          # La gestion del repositorio, su README, su firma y su workflow se mantienen.
          subprocess_args = [
              'rsync', '-a', '--delete',
              '--exclude=/.git/', '--exclude=/.github/', '--exclude=/incoming/',
              '--exclude=*.zip', '--exclude=/README*', '--exclude=/.gitignore',
              '--exclude=/COPYING', '--exclude=/THIRD_PARTY_NOTICES.md',
              '--exclude=/VALIDACION*', '--exclude=/app/geovideos-dev.jks',
              str(project) + '/', './',
          ]
          import subprocess
          subprocess.run(subprocess_args, check=True)
          PY

      - name: Limpiar archivos de validacion y README duplicados
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -iname 'VALIDACION*.txt' -o -iname 'README*.md' ! -name 'README.md' \) -print -delete

      - name: Verificar proyecto Android
        shell: bash
        run: |
          test -d app
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Preparar APK directo sin carpetas
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t apks < <(
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print0
          )
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Se esperaba una sola APK debug y se encontraron ${#apks[@]}."
            exit 1
          fi
          install -m 0644 "${apks[0]}" "$RUNNER_TEMP/Geo-Videos.apk"
          test -s "$RUNNER_TEMP/Geo-Videos.apk"
          echo "APK lista para descargar: Geo-Videos.apk"

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.version || 'Geo-Videos' }}-APK-${{ github.run_number }}
          path: ${{ runner.temp }}/Geo-Videos.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Generar un solo ZIP del proyecto actual
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path('Geo-VIDEOS-actual.zip')
          tmp = Path(os.environ['RUNNER_TEMP']) / 'Geo-VIDEOS-actual.zip'
          skip_dirs = {'.git', '.gradle', '.idea', 'build', '.cxx', '.externalNativeBuild', '__MACOSX', 'incoming'}
          with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED, compresslevel=7) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = sorted(d for d in dirs if d not in skip_dirs)
                  for name in sorted(files):
                      path = Path(root) / name
                      rel = path.as_posix().removeprefix('./')
                      if (name.lower().endswith(('.zip', '.apk', '.aab', '.iml'))
                              or name == '.DS_Store'
                              or (len(path.parts) <= 2 and name.upper().startswith('VALIDACION'))
                              or (len(path.parts) <= 2 and name.lower().startswith('readme') and name != 'README.md')):
                          continue
                      z.write(path, arcname='Geo-VIDEOS/' + rel)
          tmp.replace(archive)
          print(f'ZIP unico: {archive} ({archive.stat().st_size} bytes)')
          PY

      - name: Guardar proyecto limpio en GitHub
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail
          if [ -n "$ZIP_FILE" ]; then
            rm -f -- "$ZIP_FILE"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          for intento in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --soft "origin/$GITHUB_REF_NAME"
            if git diff --cached --quiet; then
              echo 'Repositorio actualizado sin cambios nuevos.'
              exit 0
            fi
            git commit -m 'Actualizar Geo Videos y ZIP unico del proyecto'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Otro cambio llegó al mismo tiempo; reintento $intento"
            sleep 5
          done
          echo '::error::No se pudo guardar el proyecto en GitHub después de 3 intentos.'
          exit 1

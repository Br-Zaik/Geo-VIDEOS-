name: Geo Videos - ZIP a APK

on:
  push:
    branches: [main]
    paths:
      - 'Geo-VIDEOS-*.zip'
      # No lanzar compilaciones por eliminar o reemplazar la copia del proyecto.
      - '!Geo-VIDEOS-actual.zip'
      - 'incoming/**/Geo-VIDEOS-*.zip'
      - '.github/workflows/zip-to-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geo-videos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importar-y-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detectar ZIP nuevo
        id: zip
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          candidates = []
          if os.getenv('GITHUB_EVENT_NAME') == 'push':
              previous = os.getenv('PREVIOUS_SHA', '')
              current = os.environ['GITHUB_SHA']
              if previous and previous != '0' * 40:
                  changed = subprocess.check_output(
                      ['git', 'diff', '--name-only', previous, current],
                      text=True,
                  ).splitlines()
              else:
                  changed = subprocess.check_output(
                      ['git', 'show', '--pretty=format:', '--name-only', current],
                      text=True,
                  ).splitlines()
              for name in changed:
                  path = Path(name)
                  if (path.is_file() and path.suffix.lower() == '.zip'
                          and path.name.startswith('Geo-VIDEOS-')
                          and path.name != 'Geo-VIDEOS-actual.zip'
                          and (len(path.parts) == 1 or path.parts[0] == 'incoming')):
                      candidates.append(path)

          if len(candidates) > 1:
              raise SystemExit('Sube un solo ZIP por actualizacion: ' + ', '.join(map(str, candidates)))

          file = candidates[0].as_posix() if candidates else ''
          # Solo compilar por una version nueva, cambios Android o ejecucion manual.
          required = (
              bool(file)
              or os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
              or any(
                  name.startswith(('app/', 'gradle/'))
                  or name in (
                      '.github/workflows/zip-to-apk.yml',
                      'build.gradle.kts',
                      'settings.gradle.kts',
                      'gradle.properties',
                  )
                  for name in changed
              )
          )
          # Mantener la version original para identificar y recuperar cada APK.
          import re
          version = re.sub(r'[^A-Za-z0-9._-]', '-', Path(file).stem) if file else ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'has_zip={"true" if file else "false"}\n')
              output.write(f'should_build={"true" if required else "false"}\n')
              output.write(f'file={file}\n')
              output.write(f'version={version}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if file:
                  summary.write(f'## Archivo subido: `{Path(file).name}`\n\n')
              else:
                  summary.write('## Compilacion del codigo existente (sin ZIP nuevo)\n\n')
          print('Nuevo ZIP: ' + (file or 'ninguno; compilar codigo existente'))
          PY

      - name: Extraer e importar ZIP de forma segura
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          source_zip = Path(os.environ['ZIP_FILE'])
          temp = Path(os.environ['RUNNER_TEMP']) / 'geo-videos-entrada'
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir(parents=True)

          total = 0
          with zipfile.ZipFile(source_zip) as z:
              for item in z.infolist():
                  name = item.filename.replace('\\', '/')
                  parts = PurePosixPath(name)
                  if parts.is_absolute() or '..' in parts.parts or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f'Entrada insegura: {name}')
                  total += item.file_size
                  if total > 3 * 1024 ** 3:
                      raise SystemExit('ZIP demasiado grande (limite 3 GB)')
              z.extractall(temp)

          candidates = []
          for name in ('settings.gradle.kts', 'settings.gradle'):
              for settings in temp.rglob(name):
                  project = settings.parent
                  if (project / 'app').is_dir() and len(project.relative_to(temp).parts) <= 3:
                      candidates.append(project)
          if not candidates:
              raise SystemExit('El ZIP no contiene un proyecto Android (app + settings.gradle)')
          project = min(candidates, key=lambda p: (len(p.relative_to(temp).parts), str(p)))
          # Nunca sustituir Geo Videos con otra app (por ejemplo Zeta Motion).
          import re
          gradle_file = project / 'app' / 'build.gradle.kts'
          gradle_text = gradle_file.read_text(encoding='utf-8') if gradle_file.is_file() else ''
          expected = r'com\.geovideos\.app'
          if not (re.search(r'(?m)^\s*namespace\s*=\s*"' + expected + r'"', gradle_text)
                  and re.search(r'(?m)^\s*applicationId\s*=\s*"' + expected + r'"', gradle_text)):
              raise SystemExit(
                  'ZIP rechazado: no es Geo Videos (applicationId debe ser com.geovideos.app). '
                  'El codigo del repositorio NO se modificara.'
              )
          print('Proyecto Geo Videos verificado: ' + str(project))
          # La gestion del repositorio, su README, su firma y su workflow se mantienen.
          subprocess_args = [
              'rsync', '-a', '--delete',
              '--exclude=/.git/', '--exclude=/.github/', '--exclude=/incoming/',
              '--exclude=*.zip', '--exclude=/README*', '--exclude=/.gitignore',
              '--exclude=/COPYING', '--exclude=/THIRD_PARTY_NOTICES.md',
              '--exclude=/VALIDACION*', '--exclude=/LEEME*',
              '--exclude=/app/geovideos-dev.jks',
              str(project) + '/', './',
          ]
          import subprocess
          subprocess.run(subprocess_args, check=True)
          PY

      - name: Limpiar archivos de validacion y README duplicados
        if: steps.zip.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -iname 'VALIDACION*.txt' -o -iname 'README*.md' ! -name 'README.md' \) -print -delete

      - name: Verificar proyecto Android
        if: steps.zip.outputs.should_build == 'true'
        shell: bash
        run: |
          test -d app
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          grep -Eq 'namespace[[:space:]]*=[[:space:]]*"com\.geovideos\.app"' app/build.gradle.kts
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.geovideos\.app"' app/build.gradle.kts

      - name: Preparar Java 17
        if: steps.zip.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.13
        if: steps.zip.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        if: steps.zip.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Preparar APK directo sin carpetas
        if: steps.zip.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t apks < <(
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print0
          )
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Se esperaba una sola APK debug y se encontraron ${#apks[@]}."
            exit 1
          fi
          install -m 0644 "${apks[0]}" "$RUNNER_TEMP/Geo-Videos.apk"
          test -s "$RUNNER_TEMP/Geo-Videos.apk"
          echo "APK lista para descargar: Geo-Videos.apk"

      - name: Guardar APK para descargar
        if: steps.zip.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.version || 'Geo-Videos' }}-APK-${{ github.run_number }}
          path: ${{ runner.temp }}/Geo-Videos.apk
          if-no-files-found: error
          compression-level: 0

      - name: Guardar proyecto limpio en GitHub
        if: steps.zip.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Conservar el ZIP original con su nombre de version; no renombrar ni borrar.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          for intento in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --soft "origin/$GITHUB_REF_NAME"
            if git diff --cached --quiet; then
              echo 'Repositorio actualizado sin cambios nuevos.'
              exit 0
            fi
            git commit -m 'Actualizar Geo Videos y ZIP unico del proyecto'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Otro cambio llegó al mismo tiempo; reintento $intento"
            sleep 5
          done
          echo '::error::No se pudo guardar el proyecto en GitHub después de 3 intentos.'
          exit 1

      - name: Conservar APK por version en GitHub Releases
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_FILE: ${{ steps.zip.outputs.file }}
          ZIP_VERSION: ${{ steps.zip.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$ZIP_VERSION" ]; then
            echo '::error::Falta el nombre de la version del ZIP.'
            exit 1
          fi
          APK_PERMANENTE="$RUNNER_TEMP/$ZIP_VERSION.apk"
          cp -- "$RUNNER_TEMP/Geo-Videos.apk" "$APK_PERMANENTE"
          test -s "$APK_PERMANENTE"

          TAG="geo-videos-$ZIP_VERSION-run-$GITHUB_RUN_NUMBER"
          COMMIT="$(git rev-parse HEAD)"
          gh release create "$TAG" "$APK_PERMANENTE" \
            --target "$COMMIT" \
            --title "$ZIP_VERSION" \
            --notes "APK compilada desde $ZIP_FILE. Version conservada en GitHub Releases, independiente de la caducidad de los artefactos de Actions."

          {
            echo "### APK de $ZIP_FILE guardada en Releases"
            echo ""
            echo "Descarga permanente (mientras se conserve este Release):"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
